nowo_phone_input:
    country_prefix_selector: true
    default_country: ES
    preferred_countries: [ES, FR, PT, GB, US]
    value_format: CONCATENATED
    prefix_display: FLAG_AND_PREFIX
    flag_display: CSS_ICON
    use_phone_form_theme: true
    trim: true
    # UiKit's input class on the widget's own <select> and <input> (the bundle defaults are Bootstrap classes)
    container_classes: ['nowo-phone-input']
    prefix_selector_classes: ['nowo-ui-input', 'nowo-phone-input__prefix']
    national_number_classes: ['nowo-ui-input', 'nowo-phone-input__number']
